version: '3.8'

networks:
  reza_network:
    driver: bridge

volumes:
  db_staging_data:

services:
  database:
    image: mysql:5.7
    container_name: staging_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "1234"
      MYSQL_DATABASE: demo
      MYSQL_USER: reza
      MYSQL_PASSWORD: "1234"
    ports:
      - "3306:3306"
    volumes:
      - db_staging_data:/var/lib/mysql
    networks:
      - reza_network

  backend:
    build: .
    image: reza/wayshub-backend:production
    container_name: staging_backend
    restart: always
    environment:
      DB_HOST: database
      DB_USER: reza
      DB_PASSWORD: "1234"
      DB_NAME: demo
      DB_PORT: 3306
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      - database
    networks:
      - reza_network
